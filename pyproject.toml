[project]
name = "skywatch"
version = "0.1.0"
description = "Receive-only SDR aviation monitoring station: VHF airband capture, local transcription, classification, and flight enrichment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "watchdog>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.scripts]
skywatch-worker = "skywatch.pipeline.worker:main"
skywatch-api = "skywatch.api.app:main"

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.1",
]
tuning = [
    "pyrtlsdr>=0.3",
    "numpy>=1.26",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skywatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "eval: classifier accuracy evaluation against labelled clips; run manually, not in CI",
    "network: talks to real external APIs and needs credentials; run manually, not in CI",
]
